# Pinned per-project so the workspace builds reproducibly without touching the
# machine's default `stable`.
#
# libsqlite3-sys 0.38 (via rusqlite 0.40) needs `cfg_select!`, stabilised after 1.91. Several
# other pinned dependencies, wasmtime and librqbit among them, track recent toolchains too, so
# pinning one dependency backwards would only defer the same problem. 1.99.1 is the stable
# release at the time of that move.
[toolchain]
channel = "1.99.1"
components = ["clippy", "rustfmt"]
# The Apple app's engine slices beside the host: an iPhone and the iOS Simulator on Apple silicon.
# apple/scripts/engine.sh builds them, and the ios CI job checks the iPhone one.
targets = ["aarch64-apple-ios", "aarch64-apple-ios-sim"]
