<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kaeri</title>
<!-- Kaeri's Cast receiver. Source: website/src/cast-receiver/, built by website/scripts/cast-receiver.ts. -->
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="receiver.css">
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<script type="module" src="app.js"></script>
</head>
<body>
<div id="stage"><video id="video" playsinline></video></div>
<canvas id="still" aria-hidden="true"></canvas>
<div id="ui" data-phase="idle">
	<div id="city" class="layer" aria-hidden="true"><div class="sky"></div><canvas></canvas><canvas></canvas></div>
	<div id="art" class="layer"><img alt=""></div>
	<div id="dim" class="layer"></div>

	<div id="ready">
		<div class="wm">Kaeri</div>
		<div class="line"><span id="ready-line"></span><span id="closing-line"></span></div>
	</div>

	<div id="ov" class="layer">
		<div class="band"></div>
		<div class="ov">
			<div class="show" id="ov-show"></div>
			<div class="ep" id="ov-episode"></div>
			<div class="row">
				<div id="ov-bar"><div class="seek"><i></i></div><div class="times"><span id="ov-at"></span><span id="ov-left"></span></div></div>
				<div id="starting"><span class="lights"><i></i><i></i><i></i><i></i></span><span id="starting-text"></span></div>
			</div>
		</div>
	</div>

	<div id="paused">
		<svg width="32" height="32" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.4" y="2.4" width="3.2" height="11.2" rx="1" fill="currentColor"/><rect x="9.4" y="2.4" width="3.2" height="11.2" rx="1" fill="currentColor"/></svg>
		<span id="paused-text"></span>
	</div>

	<div class="card" id="waiting"><span class="lights"><i></i><i></i><i></i><i></i></span><span id="waiting-text"></span></div>

	<div class="card" id="upnext">
		<div class="still"><img alt=""></div>
		<div class="track"><i></i></div>
		<div class="count" id="upnext-count"></div>
		<div class="title" id="upnext-title"></div>
	</div>

	<div class="card note" id="skipped">
		<svg width="28" height="28" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5 L6.5 12 L13 4.5"/></svg>
		<span id="skipped-text"></span>
	</div>

	<div class="card note" id="plain"></div>

	<div class="msg" id="gone">
		<span class="lights"><i></i><i></i><i></i><i></i></span>
		<div class="title" id="gone-title"></div>
		<div class="hint" id="gone-hint"></div>
	</div>

	<div class="msg" id="error">
		<div class="title">
			<svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6 L22.4 20.6 H1.6 Z" fill="currentColor"/><rect x="11" y="9" width="2" height="6.4" rx="1" fill="#161a2e"/><rect x="11" y="16.8" width="2" height="2" rx="1" fill="#161a2e"/></svg>
			<span id="error-title"></span>
		</div>
		<div class="show" id="error-show"></div>
		<div class="reason" id="error-reason"></div>
		<div class="hint" id="error-hint"></div>
	</div>

	<div id="finished">
		<div class="still"><img alt=""></div>
		<div class="text">
			<div class="show" id="finished-show"></div>
			<div class="line" id="finished-line"></div>
		</div>
		<div class="wm">Kaeri</div>
	</div>

	<div id="black" class="layer"></div>
</div>
</body>
</html>
