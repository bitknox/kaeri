[package]
name = "kaeri-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cross-device sync: encrypted change segments, cloud folder targets, the peer exchange and pairing"
publish = false

[lib]
# No doc example is written as a test, and rustdoc spends seconds per crate finding none.
doctest = false

[features]
# Fake servers on the loopback interface (WebDAV, Nextcloud, Google), for tests and Fixtures builds.
testing = []

[dependencies]
kaeri-core.workspace = true
kaeri-store.workspace = true
kaeri-remote.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
reqwest.workspace = true
ring = "0.17"
curve25519-dalek = "4.1"
base64 = "0.23"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
