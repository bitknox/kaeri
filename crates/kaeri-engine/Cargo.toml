[package]
name = "kaeri-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The work behind Kaeri's front ends: playback, sources, sync, downloads and background jobs"
publish = false

[lib]
# No doc example is written as a test, and rustdoc spends seconds per crate finding none.
doctest = false

# No terminal crate, not even transitively, and not the terminal front end: the engine runs under
# front ends that are not a terminal. tools/check-boundaries.sh holds it to that in CI.
[features]
default = ["desktop"]
# What a desktop has and a phone has not: the Discord presence (also `presence` alone), the mpv
# child process each playback runs, watch parties (also `party` alone), the browser redirect AniList and MyAnimeList sign in through,
# notifications through osascript and notify-send, pmset's word on the battery, and the OS
# keychain through `keyring`. Without it none of these is built, nor are `kaeri-player`,
# `open` and `keyring`. The crate docs say what a front end without it gets instead.
desktop = ["presence", "party", "dep:kaeri-player", "dep:open", "kaeri-track/keychain"]
# The Discord presence an episode shows while it plays, and nothing else of the desktop: the Mac
# app turns it on beside `--no-default-features`, with no mpv child process. A phone's build
# leaves it off, and its front end is told so (`SettingsView::presence_available`).
presence = ["dep:kaeri-discord"]
# What a test stands the engine up with instead of what it builds, and what only a test wants to
# hear from it: see `options::Parts` and `engine::Traced`. Never on in a build that ships: the
# binary turns it on for its own tests alone, as a dev-dependency.
testing = ["kaeri-party?/testing", "kaeri-sync/testing"]
# Watch parties on a Syncplay server, played with whichever player a play has: see `party`. The
# desktop apps turn it on beside `--no-default-features`; a phone's build leaves it off for now.
party = ["dep:kaeri-party"]
# The remote's server a TV runs beside the engine, for phones to drive it with: see `remote`. Off
# until a TV app's build turns it on; nothing starts it yet.
remote = ["dep:kaeri-remote"]
# Casting to TVs with Chromecast built in, from the remote's TV picker: see `cast` and
# `playback::link::cast`. Rides on `remote`, whose sender the picker is.
cast = ["remote", "dep:kaeri-cast"]

[dependencies]
kaeri-core.workspace = true
kaeri-jellyfin.workspace = true
kaeri-meta.workspace = true
kaeri-i18n.workspace = true
kaeri-model.workspace = true
kaeri-net.workspace = true
kaeri-discord = { workspace = true, optional = true }
kaeri-party = { workspace = true, optional = true }
kaeri-player = { workspace = true, optional = true }
# The pure half of playback, which the session drives any player with: the policy, the tracks,
# skips, and what a player reports and is shown. Allowed in a phone's build.
kaeri-playback.workspace = true
kaeri-audio-tap.workspace = true
kaeri-plugin = { workspace = true, features = ["fetch"] }
kaeri-plugin-store.workspace = true
kaeri-store-server.workspace = true
kaeri-providers.workspace = true
kaeri-remote = { workspace = true, optional = true }
kaeri-cast = { workspace = true, optional = true }
kaeri-store.workspace = true
kaeri-sync.workspace = true
hex = "0.4"
kaeri-track.workspace = true
# The reader: book files opened and pages processed on the page worker.
kaeri-books.workspace = true
kaeri-pages.workspace = true
toml.workspace = true
open = { workspace = true, optional = true }
async-trait.workspace = true
thiserror.workspace = true
futures.workspace = true
image.workspace = true
# When an episode yet to air airs, said in the reader's own zone.
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
# Random tokens for the stream proxy's loopback path.
rand = "0.10"
# Named by the stream proxy, whose upstream requests go through `HttpClient::sources`.
reqwest.workspace = true

# What is free on the disk downloads land on, which keep next stops short of. Safe statvfs: the
# workspace forbids unsafe code. Already in the tree through wasmtime and tempfile.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
# Comic archives of generated pages, for the reader's tests.
zip.workspace = true
image.workspace = true
# A stopped clock, for the paced fills that wait seconds between titles and the start that
# waits two minutes for a connection.
tokio = { workspace = true, features = ["test-util"] }
# The fixture titles' schedules, for keep next's tests of what is out.
kaeri-testkit.workspace = true
# A Syncplay server on the loopback interface, for the watch party's tests.
kaeri-party = { workspace = true, features = ["testing"] }
# A Cast receiver on the loopback interface, for casting's tests.
kaeri-cast = { workspace = true, features = ["fake"] }

# These play in mpv, or sign in the way only the desktop does.
[[example]]
name = "playback_probe"
required-features = ["desktop"]

[[example]]
name = "kitsu_probe"
required-features = ["desktop"]

[[example]]
name = "mal_probe"
required-features = ["desktop"]

[[example]]
name = "simkl_probe"
required-features = ["desktop"]

[[test]]
name = "binge"
required-features = ["desktop"]

[[test]]
name = "link_golden"
required-features = ["desktop"]

[lints]
workspace = true
