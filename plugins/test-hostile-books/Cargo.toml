[workspace]

[package]
name = "kaeri-hostile-books-plugin"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A misbehaving book source plugin, used to prove the sandbox holds for book sources"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.63"

[profile.release]
opt-level = "s"
lto = true
strip = true
