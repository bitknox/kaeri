# Its own workspace root. A plugin targets `wasm32-wasip2` and should be buildable by someone who
# has only this directory and the WIT file.
[workspace]

[package]
name = "kaeri-example-books-plugin"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A reference book source plugin, demonstrating the kaeri:books ABI"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.63"

[profile.release]
# A plugin is a parser, so size matters more than speed.
opt-level = "s"
lto = true
strip = true
panic = "abort"
